      function getCookieYesConsentValue(key) {
        var consentCookie = document.cookie
          .split('; ')
          .find(function (entry) {
            return entry.indexOf('cookieyes-consent=') === 0
          })

        if (!consentCookie) return null

        var consentValue = consentCookie.slice('cookieyes-consent='.length)

        try {
          return decodeURIComponent(consentValue)
            .split(',')
            .reduce(function (acc, pair) {

              }
              return acc
